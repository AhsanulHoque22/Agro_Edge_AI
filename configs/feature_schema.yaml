# AgroEdge AI — Feature Vector Schema
# Version: 1.0
#
# Defines the exact feature contract between the data pipeline and all ML models.
# The feature ORDER here is fixed. Do not change it after model training
# without retraining and re-exporting the model.
#
# This file is read by:
#   - data_pipeline/feature_engineering/ (to build feature vectors)
#   - edge_inference/ (to validate inputs before calling the model)
#   - model_export/ (embedded in every model package as feature_schema.json)

schema_version: "1.0"

# ── Irrigation Model Feature Vector ──────────────────────────────────────────
# 14 features total. Order is fixed.

features:

  - name: soil_moisture_percent
    type: float
    source: sensor
    required: true
    critical: true
    description: "Volumetric soil moisture (%). Primary predictor for irrigation need."

  - name: soil_temperature_celsius
    type: float
    source: sensor
    required: true
    critical: false
    description: "Soil temperature at root zone (°C)."

  - name: air_temperature_celsius
    type: float
    source: sensor
    required: true
    critical: false
    description: "Ambient air temperature (°C). Drives evapotranspiration rate."

  - name: air_humidity_percent
    type: float
    source: sensor
    required: true
    critical: false
    description: "Relative humidity (%). Component of VPD calculation."

  - name: light_intensity_lux
    type: float
    source: sensor
    required: true
    critical: false
    description: "Light intensity (lux). Affects stomatal opening and transpiration."

  - name: water_tank_level_percent
    type: float
    source: sensor
    required: true
    critical: true
    description: "Water tank fill level (%). Safety constraint — no irrigation if tank is low."

  - name: growth_stage_encoded
    type: int
    source: farm_metadata
    required: true
    critical: true
    encoding_map: growth_stage_encoding
    description: "Integer-encoded rice growth stage (0–7). Determines water requirement window."

  - name: days_after_transplanting
    type: int
    source: derived
    required: true
    critical: false
    description: "Days elapsed since planting date. Refines growth stage within a stage window."

  - name: days_to_maturity
    type: int
    source: derived
    required: true
    critical: false
    description: "Days remaining until harvest. Negative values indicate overdue harvest."

  - name: vpd_kpa
    type: float
    source: derived
    required: true
    critical: false
    formula: "(1 - air_humidity_percent/100) * 0.6108 * exp(17.27 * air_temperature_celsius / (air_temperature_celsius + 237.3))"
    description: "Vapor Pressure Deficit (kPa). Quantifies plant water stress from heat and dryness."

  - name: hour_of_day
    type: int
    source: derived
    required: true
    critical: false
    description: "Hour when reading was taken (0–23). Captures diurnal irrigation patterns."

  - name: day_of_week
    type: int
    source: derived
    required: false
    critical: false
    description: "Day of week (0=Monday, 6=Sunday). Low importance; included for completeness."

  - name: month
    type: int
    source: derived
    required: false
    critical: false
    description: "Month of year (1–12). Captures seasonal variation in water demand."

  - name: days_since_last_irrigation
    type: int
    source: irrigation_log
    required: true
    critical: true
    description: "Days elapsed since the last irrigation event. Prevents over-irrigation."

# ── Encoding Maps ──────────────────────────────────────────────────────────────
# These maps must be embedded in every exported model package (encoder_map.json).

growth_stage_encoding:
  "0_germination":       0
  "1_seedling":          1
  "2_tillering":         2
  "3_stem_elongation":   3
  "4_booting":           4
  "5_heading_flowering": 5
  "6_grain_filling":     6
  "7_ripening_maturity": 7

# BBCH-based DAT thresholds — variety-agnostic median ranges
# Format: [start_day_inclusive, end_day_exclusive]
# Rice variety may shift boundaries by ±10 days.
growth_stage_dat_ranges:
  "0_germination":       [0,   7]
  "1_seedling":          [7,   25]
  "2_tillering":         [25,  55]
  "3_stem_elongation":   [55,  75]
  "4_booting":           [75,  90]
  "5_heading_flowering": [90,  110]
  "6_grain_filling":     [110, 130]
  "7_ripening_maturity": [130, 160]

crop_type_encoding:
  rice: 0
  # Additional crops added here without breaking the schema.
  # crop_type is NOT in the feature vector for v1 (rice-only system).
  # It will be added when multi-crop support is introduced.

# ── Disease Model Label Registry ──────────────────────────────────────────────

disease_labels:
  - healthy
  - rice_blast
  - brown_spot
  - bacterial_leaf_blight
  - sheath_blight
  - tungro
  - leaf_scald
  - unknown
